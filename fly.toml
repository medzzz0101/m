# fly.toml — deploy LATTICE to Fly.io as a real public site.
#   flyctl launch --no-deploy   (accept this file)   then   flyctl deploy
# Fly builds the Dockerfile and gives you https://<app>.fly.dev.
app = "lattice"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/api/health"
  interval = "30s"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
